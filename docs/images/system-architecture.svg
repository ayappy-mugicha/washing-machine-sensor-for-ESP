<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">洗濯機君のシステム構成図</title>
  <desc id="desc">Seeed XIAO ESP32C3 が MPU6050 の振動を読み、Wi-Fi 経由で NTP と Discord Incoming Webhook に接続する構成。</desc>
  <rect width="1180" height="760" fill="#fbf8f3"/>
  <text x="36" y="42" fill="#1c1915" font-family="sans-serif" font-size="22" font-weight="700">洗濯機君 — システム構成</text>
  <text x="36" y="66" fill="#5c564c" font-family="sans-serif" font-size="13">電池駆動の XIAO ESP32C3 が振動を見て、干し忘れを Discord に知らせる</text>

  <rect x="24" y="88" width="732" height="430" rx="16" fill="#f3eee4" stroke="#d9d0c2"/>
  <text x="44" y="116" fill="#5c564c" font-family="sans-serif" font-size="13" font-weight="700">現場（洗濯機のそば）</text>

  <rect x="44" y="140" width="150" height="72" rx="12" fill="#f6efe4" stroke="#8a4b32" stroke-width="1.5"/>
  <text x="119" y="170" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="15" font-weight="700">洗濯機</text>
  <text x="119" y="192" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">筐体の振動</text>

  <line x1="194" y1="176" x2="228" y2="176" stroke="#8a4b32" stroke-width="1.5"/>
  <polygon points="228,176 220,172 220,180" fill="#8a4b32"/>
  <text x="211" y="166" text-anchor="middle" fill="#8a4b32" font-family="sans-serif" font-size="11">振動</text>

  <rect x="228" y="140" width="168" height="72" rx="12" fill="#f8e7dc" stroke="#8a4b32" stroke-width="1.5"/>
  <text x="312" y="166" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="15" font-weight="700">MPU6050</text>
  <text x="312" y="188" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">加速度 3 軸 / I2C 0x68</text>

  <line x1="396" y1="176" x2="448" y2="176" stroke="#143d32" stroke-width="1.5"/>
  <polygon points="448,176 440,172 440,180" fill="#143d32"/>
  <text x="422" y="166" text-anchor="middle" fill="#143d32" font-family="sans-serif" font-size="11">I2C</text>

  <rect x="448" y="136" width="280" height="196" rx="14" fill="#d7ebe3" stroke="#143d32" stroke-width="1.75"/>
  <text x="588" y="164" text-anchor="middle" fill="#143d32" font-family="sans-serif" font-size="16" font-weight="700">Seeed XIAO ESP32C3</text>
  <text x="588" y="186" text-anchor="middle" fill="#245c4a" font-family="sans-serif" font-size="12">Arduino / ディープスリープ</text>
  <text x="468" y="214" fill="#1c1915" font-family="sans-serif" font-size="12">SDA GPIO6 / SCL GPIO7</text>
  <text x="468" y="234" fill="#1c1915" font-family="sans-serif" font-size="12">RTC: フェーズ・単調秒・オフセット</text>
  <text x="468" y="254" fill="#1c1915" font-family="sans-serif" font-size="12">WasherJudge / DiscordClient</text>
  <text x="468" y="274" fill="#1c1915" font-family="sans-serif" font-size="12">NetworkSystem / SleepMode</text>
  <text x="468" y="294" fill="#1c1915" font-family="sans-serif" font-size="12">USB CDC 115200</text>
  <text x="468" y="314" fill="#8a6a12" font-family="sans-serif" font-size="12">バッテリ ADC A3（通知には未使用）</text>

  <rect x="44" y="248" width="150" height="72" rx="12" fill="#fbf8f3" stroke="#8a6a12" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="119" y="278" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="15" font-weight="700">電池</text>
  <text x="119" y="300" text-anchor="middle" fill="#8a6a12" font-family="sans-serif" font-size="12">ADC は未通知</text>
  <line x1="194" y1="284" x2="448" y2="300" stroke="#8a6a12" stroke-width="1.25" stroke-dasharray="5 4"/>

  <rect x="44" y="360" width="220" height="120" rx="12" fill="#fbf8f3" stroke="#5c564c"/>
  <text x="154" y="388" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="15" font-weight="700">開発用 PC</text>
  <text x="64" y="414" fill="#5c564c" font-family="sans-serif" font-size="12">PlatformIO / VS Code</text>
  <text x="64" y="434" fill="#5c564c" font-family="sans-serif" font-size="12">pio run · upload · monitor</text>
  <text x="64" y="454" fill="#5c564c" font-family="sans-serif" font-size="12">native テストは Unity</text>
  <line x1="264" y1="400" x2="448" y2="300" stroke="#5c564c" stroke-width="1.25"/>
  <polygon points="448,300 438,304 442,292" fill="#5c564c"/>
  <text x="300" y="356" fill="#5c564c" font-family="sans-serif" font-size="11">USB 書き込み / シリアル</text>

  <rect x="776" y="88" width="380" height="430" rx="16" fill="#eef2f8" stroke="#d5deec"/>
  <text x="796" y="116" fill="#5c564c" font-family="sans-serif" font-size="13" font-weight="700">ネットワーク</text>

  <line x1="728" y1="220" x2="856" y2="176" stroke="#243e66" stroke-width="1.5"/>
  <polygon points="856,176 844,174 850,186" fill="#243e66"/>
  <text x="748" y="200" fill="#243e66" font-family="sans-serif" font-size="11">Wi-Fi STA</text>

  <rect x="856" y="140" width="268" height="64" rx="12" fill="#fbf8f3" stroke="#243e66" stroke-width="1.5"/>
  <text x="990" y="166" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="15" font-weight="700">無線 LAN AP</text>
  <text x="990" y="188" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">SSID / パスワードは config.h</text>

  <line x1="940" y1="204" x2="900" y2="248" stroke="#243e66" stroke-width="1.5"/>
  <polygon points="900,248 910,242 898,238" fill="#243e66"/>
  <rect x="796" y="248" width="200" height="72" rx="12" fill="#fbf8f3" stroke="#243e66" stroke-width="1.5"/>
  <text x="896" y="276" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="15" font-weight="700">NTP</text>
  <text x="896" y="298" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">ntp.nict.jp / JST</text>

  <line x1="1080" y1="204" x2="1080" y2="360" stroke="#3c3480" stroke-width="1.5"/>
  <polygon points="1080,360 1076,352 1084,352" fill="#3c3480"/>
  <text x="1088" y="280" fill="#3c3480" font-family="sans-serif" font-size="11">HTTPS</text>
  <rect x="856" y="360" width="268" height="120" rx="12" fill="#ece8f8" stroke="#3c3480" stroke-width="1.5"/>
  <text x="990" y="390" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="15" font-weight="700">Discord</text>
  <text x="990" y="414" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">Incoming Webhook</text>
  <text x="990" y="434" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">HTTPS POST / JSON content</text>
  <text x="990" y="454" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">証明書ピン留めなし</text>

  <rect x="24" y="536" width="1132" height="188" rx="16" fill="#f3eee4" stroke="#d9d0c2"/>
  <text x="44" y="564" fill="#5c564c" font-family="sans-serif" font-size="13" font-weight="700">1 回の起床で通る処理（loop は空。スリープ後は再起動）</text>

  <rect x="44" y="584" width="150" height="108" rx="10" fill="#fbf8f3" stroke="#143d32"/>
  <text x="119" y="612" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="13" font-weight="700">起床</text>
  <text x="119" y="634" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">Wi-Fi 接続</text>
  <text x="119" y="654" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">NTP で時刻</text>
  <text x="119" y="674" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">夜間なら長睡眠</text>

  <line x1="194" y1="638" x2="228" y2="638" stroke="#143d32"/>
  <polygon points="228,638 220,634 220,642" fill="#143d32"/>

  <rect x="228" y="584" width="168" height="108" rx="10" fill="#fbf8f3" stroke="#8a4b32"/>
  <text x="312" y="612" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="13" font-weight="700">計測</text>
  <text x="312" y="634" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">約 3 秒の窓</text>
  <text x="312" y="654" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">60 x 50 ms</text>
  <text x="312" y="674" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">RMS と蓋の傾き</text>

  <line x1="396" y1="638" x2="430" y2="638" stroke="#143d32"/>
  <polygon points="430,638 422,634 422,642" fill="#143d32"/>

  <rect x="430" y="584" width="186" height="108" rx="10" fill="#fbf8f3" stroke="#143d32"/>
  <text x="523" y="612" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="13" font-weight="700">判定</text>
  <text x="523" y="634" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">開始 / 終了候補</text>
  <text x="523" y="654" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">干し忘れ / 干し済み</text>
  <text x="523" y="674" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">WasherJudge</text>

  <line x1="616" y1="638" x2="650" y2="638" stroke="#3c3480"/>
  <polygon points="650,638 642,634 642,642" fill="#3c3480"/>

  <rect x="650" y="584" width="210" height="108" rx="10" fill="#fbf8f3" stroke="#3c3480"/>
  <text x="755" y="612" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="13" font-weight="700">通知</text>
  <text x="755" y="634" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">干してね / ありがとう</text>
  <text x="755" y="654" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">初回接続・センサーなし</text>
  <text x="755" y="674" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">おねんね</text>

  <line x1="860" y1="638" x2="894" y2="638" stroke="#143d32"/>
  <polygon points="894,638 886,634 886,642" fill="#143d32"/>

  <rect x="894" y="584" width="230" height="108" rx="10" fill="#d7ebe3" stroke="#143d32"/>
  <text x="1009" y="612" text-anchor="middle" fill="#1c1915" font-family="sans-serif" font-size="13" font-weight="700">睡眠</text>
  <text x="1009" y="634" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">Wi-Fi 切断 / センサ停止</text>
  <text x="1009" y="654" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">タイマーで Deep Sleep</text>
  <text x="1009" y="674" text-anchor="middle" fill="#5c564c" font-family="sans-serif" font-size="12">通常 300 秒</text>
</svg>
